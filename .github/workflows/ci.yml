name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: lint · types · unit · rls · e2e · budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The local Supabase stack. The RLS assertions and every e2e spec that
      # compares the screen to the database need a real Postgres — a mock would
      # prove nothing about the policies, which is the point of having them.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run db:test

      - run: npm run build
      # Greps the BUILT stylesheet. Tailwind prunes rules it does not recognise
      # as used, and an attribute selector is not a class name — the reveal
      # tiers have vanished from a green build before.
      - run: ./scripts/verify-tokens.sh

      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      - run: SKIP_BUILD=1 ./scripts/with-prod-server.sh npx playwright test
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321

      # Fails the build when a route's own JavaScript exceeds its cap.
      - run: SKIP_BUILD=1 ./scripts/with-prod-server.sh node scripts/check-budgets.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: lighthouse (marketing)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Reports rather than gates. Accessibility, best practices, and SEO sit at
    # 100; Performance sits at 93 against §5's 95, and the whole gap is
    # Lighthouse's SIMULATED LCP on a payload that is 139KB framework floor
    # before a line of this repository's code runs. Measured with real 4G and
    # 4x CPU throttling the same page reaches LCP in ~1.0s, inside §5's 2.0s.
    # See docs/05-DECISIONS.md. Blocking merges on a number the stack cannot
    # reach would train everyone to ignore a red check.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lighthouse
