name: Monthly recovery-copy integrity

on:
  schedule:
    # The day-01 writer has more than a day to publish the monthly tier first.
    - cron: "23 3 2 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly-recovery-copy-integrity
  cancel-in-progress: false

jobs:
  integrity:
    name: download and verify the newest monthly ciphertext
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Verify ciphertext, sidecar and recorded recovery counts
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: coditu
        run: ./scripts/check-backup-integrity.sh
