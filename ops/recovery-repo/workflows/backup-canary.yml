name: Recovery copy freshness

on:
  schedule:
    # Every three hours, away from the top-of-hour load peak. The external
    # heartbeat detects if this schedule stops being dispatched at all.
    #
    # It was hourly. 720 runs a month, each billed as a whole minute, is a third
    # of the free private-repo allowance spent re-reading a file that changes
    # once a day — and the failure mode of running out is that the NIGHTLY
    # BACKUP stops, silently. Three-hourly still detects a stale copy nine times
    # inside the 26-hour threshold it is checking against. ADR, 2026-08-29.
    - cron: "47 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-copy-freshness
  cancel-in-progress: false

jobs:
  canary:
    name: newest set is complete and younger than 26 hours
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Read the newest off-site recovery set
        env:
          RECOVERY_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKUP_MAX_AGE_SECONDS: "93600"
          BACKUP_CANARY_OUTPUT: ${{ runner.temp }}/backup-canary.json
        run: ./scripts/check-backup-freshness.sh

      # Both publishing steps are opt-in. An unset secret skips its step with a
      # notice rather than failing the canary: a missing heartbeat URL is a
      # setup gap, and turning it into a red run every three hours trains
      # everyone to ignore the one colour that is supposed to mean something.
      - name: Publish only the evidence this canary read
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          BACKUP_CANARY_REPORT_SECRET: ${{ secrets.BACKUP_CANARY_REPORT_SECRET }}
          BACKUP_CANARY_OUTPUT: ${{ runner.temp }}/backup-canary.json
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_BASE_URL:-}" ] || [ -z "${BACKUP_CANARY_REPORT_SECRET:-}" ]; then
            echo "::notice::no report target configured; the Recovery Centre will keep showing 'not verified by this app'"
            exit 0
          fi
          test -s "$BACKUP_CANARY_OUTPUT"
          curl --fail --silent --show-error \
            --max-time 20 --retry 2 --retry-all-errors \
            --header "Authorization: Bearer $BACKUP_CANARY_REPORT_SECRET" \
            --header "Content-Type: application/json" \
            --data-binary "@$BACKUP_CANARY_OUTPUT" \
            "$PRODUCTION_BASE_URL/api/backup-health"

      # LAST, and on success only. `if: success()` is the default, but it is
      # written out because the whole value of this step is *where* it sits: a
      # ping that fires regardless of outcome proves the runner booted, not
      # that the backup was verified — and a dead-man's switch that reports
      # "alive" while the thing it watches is broken is worse than no switch,
      # because it is believed.
      #
      # The receiver is healthchecks.io, NOT UptimeRobot: UptimeRobot's
      # cron/heartbeat monitor type is paid ("Available only in Solo, Team and
      # Scale"), and its free plan is HTTP / Keyword / Ping / Port only.
      # healthchecks.io monitors 20 cron jobs free with no card. ADR 2026-08-29.
      # `HEARTBEAT_URL` is `https://hc-ping.com/<uuid>` — treat the path as a
      # credential, because possessing it can forge a successful check-in.
      - name: Tell the independent monitor this check passed
        if: success()
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HEARTBEAT_URL:-}" ]; then
            echo "::notice::HEARTBEAT_URL is not set; external alerting is NOT active. Nothing will tell anybody if this canary stops running."
            exit 0
          fi
          curl -fsS --max-time 15 --retry 2 --retry-connrefused \
            --output /dev/null "$HEARTBEAT_URL"
          echo "heartbeat sent"
